name: Fork Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for manual runs)"
        type: string
        required: true
        default: "v0.1.11-nightly.20261119.4941"
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build_windows_exe:
    name: Build Windows x64 (.exe)
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch --no-tags --depth=1 origin "${{ github.sha }}"; then
            git fetch --no-tags --depth=1 origin "${{ github.ref }}"
          fi
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
          } else {
            $tag = "${{ github.ref_name }}"
            $prerelease = if ($tag -match '-(alpha|beta|nightly|preview|rc)') { "true" } else { "false" }
          }
          $version = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Resolve T3 Connect public config
        shell: pwsh
        run: |
          $envExample = @{}
          foreach ($line in Get-Content ".env.example") {
            $trimmed = $line.Trim()
            if (-not $trimmed -or $trimmed.StartsWith("#")) { continue }
            $idx = $trimmed.IndexOf("=")
            if ($idx -gt 0) {
              $envExample[$trimmed.Substring(0, $idx).Trim()] = $trimmed.Substring($idx + 1).Trim()
            }
          }
          $resolved = @{
            T3CODE_CLERK_PUBLISHABLE_KEY = "${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}"
            T3CODE_CLERK_JWT_TEMPLATE = "${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}"
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID = "${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}"
            T3CODE_RELAY_URL = "${{ vars.T3CODE_RELAY_URL }}"
          }
          foreach ($key in @($resolved.Keys)) {
            if ([string]::IsNullOrWhiteSpace($resolved[$key])) {
              $resolved[$key] = [string]$envExample[$key]
            }
            if ([string]::IsNullOrWhiteSpace($resolved[$key])) {
              throw "Missing required public T3 Connect variable: $key"
            }
            "$key=$($resolved[$key])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $releaseChannel = if ("${{ steps.version.outputs.prerelease }}" -eq "true") { "nightly" } else { "stable" }
          "VITE_RELEASE_CHANNEL=$releaseChannel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer (.exe)
        shell: pwsh
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$env:BUILD_VERSION" --verbose

      - name: Verify T3 Connect config baked into bundle
        shell: pwsh
        run: |
          $serverFiles = @(Get-ChildItem -Path "apps/server/dist" -Recurse -File -Include *.js,*.mjs,*.cjs)
          if ($serverFiles.Count -eq 0) {
            throw "No built files found in apps/server/dist"
          }
          $relayHost = ([uri]$env:T3CODE_RELAY_URL).Host
          $serverChecks = @(
            $relayHost,
            $env:T3CODE_CLERK_PUBLISHABLE_KEY,
            $env:T3CODE_CLERK_JWT_TEMPLATE,
            $env:T3CODE_CLERK_CLI_OAUTH_CLIENT_ID
          )
          foreach ($needle in $serverChecks) {
            if (-not ($serverFiles | Select-String -SimpleMatch -Pattern $needle -Quiet)) {
              throw "Missing '$needle' in apps/server/dist bundle"
            }
          }
          $desktopFiles = @(Get-ChildItem -Path "apps/desktop/dist-electron" -Recurse -File -Include *.js,*.mjs,*.cjs)
          if ($desktopFiles.Count -eq 0) {
            throw "No built files found in apps/desktop/dist-electron"
          }
          if (-not ($desktopFiles | Select-String -SimpleMatch -Pattern $env:T3CODE_CLERK_PUBLISHABLE_KEY -Quiet)) {
            throw "Missing '$($env:T3CODE_CLERK_PUBLISHABLE_KEY)' in apps/desktop/dist-electron bundle"
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-exe
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $assets = @(
            Get-ChildItem release/*.exe, release/*.blockmap, release/*.yml -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne "builder-debug.yml" } |
              ForEach-Object { $_.FullName }
          )
          if (@($assets | Where-Object { $_ -like "*.exe" }).Count -eq 0) {
            throw "No .exe release artifacts found in release/"
          }
          $null = & gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $flags = @("--title", "T3 Code $env:RELEASE_TAG", "--generate-notes", "--target", "${{ github.sha }}")
            if ($env:IS_PRERELEASE -eq "true") {
              $flags += "--prerelease"
            }
            & gh release create $env:RELEASE_TAG @assets @flags
          }
