name: Fork Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for manual runs)"
        type: string
        required: true
        default: "v0.1.9-custom.1"
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build_windows_exe:
    name: Build Windows x64 (.exe)
    if: github.repository != 'pingdotgg/t3code'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
          } else {
            $tag = "${{ github.ref_name }}"
            $prerelease = if ($tag -match '-(alpha|beta|nightly|preview|rc)') { "true" } else { "false" }
          }
          $version = $tag -replace '^v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows installer (.exe)
        shell: pwsh
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$env:BUILD_VERSION" --verbose

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-exe
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $assets = @(Get-ChildItem release/*.exe, release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No .exe release artifacts found in release/"
          }
          $null = & gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $flags = @("--title", "T3 Code $env:RELEASE_TAG", "--generate-notes", "--target", "${{ github.sha }}")
            if ($env:IS_PRERELEASE -eq "true") {
              $flags += "--prerelease"
            }
            & gh release create $env:RELEASE_TAG @assets @flags
          }
